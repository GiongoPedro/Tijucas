<style>
  .iconografia-container {
    color: #000;
    margin-top: 4em;
    margin-bottom: 5em;
  }

  .iconografia-text-block {
    margin-bottom: 1.2em;
  }

  .iconografia-title {
    font-size: 1.3em;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 15px;
    text-transform: none;
    line-height: 1.25;
  }

  .iconografia-intro {
    font-size: 0.85em;
    margin-bottom: 1.5em;
    text-transform: none;
    line-height: 1.6;
    font-style: italic;
    opacity: 0.85;
  }

  .iconografia-meta {
    font-size: 0.55em;
    line-height: 1.6;
    color: #444;
    text-transform: none;
  }

  .iconografia-meta strong {
    font-weight: bold;
  }

  /* Carrossel */
  .iconografia-carousel {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-top: 1.5em;
    width: 100%;
  }

  .carousel-featured {
    width: 100%;
    max-width: 500px;
    height: 500px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    background-color: transparent;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .carousel-featured img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    transition: opacity 0.25s ease-in-out;
    opacity: 1;
  }

  .carousel-featured img.fade-out {
    opacity: 0;
  }

  .carousel-thumbnails {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-start;
    max-width: 500px;
    width: 100%;
  }

  .carousel-thumbnails img {
    width: 42px;
    height: 42px;
    object-fit: cover;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.2s ease, border-color 0.2s ease;
    border: 1.5px solid transparent;
  }

  .carousel-thumbnails img:hover {
    opacity: 0.8;
  }

  .carousel-thumbnails img.active {
    opacity: 1;
    border-color: #000;
  }

  /* Responsividade */
  @media screen and (max-width: 768px) {
    .carousel-featured {
      height: 350px;
    }
    
    .carousel-thumbnails img {
      width: 38px;
      height: 38px;
    }
  }

  @media screen and (max-width: 480px) {
    .carousel-featured {
      height: 280px;
    }
  }
</style>

<div class="iconografia-container">
  <div class="iconografia-text-block">
    <h2 class="iconografia-title">Iconography</h2>
    <p class="iconografia-intro">In an old bag, I keep all the papers I find along the way.</p>
    <div class="iconografia-meta">
      <strong>Untitled Series</strong><br>
      Collage, diverse formats, 2021-2022
    </div>
  </div>

  <div class="iconografia-carousel">
    <div class="carousel-featured">
      <img id="featured-image" src="../assets/images/iconografia/serie 2021-2022/colagem01_500_500.jpg" alt="Featured collage">
    </div>
    
    <div class="carousel-thumbnails">
      <img class="thumb active" src="../assets/images/iconografia/serie 2021-2022/colagem01_500_500.jpg" alt="Collage 01">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem02_500_500.jpg" alt="Collage 02">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem03_500_500.jpg" alt="Collage 03">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem04_500.jpg" alt="Collage 04">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem06_500.jpg" alt="Collage 06">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem07_350.jpg" alt="Collage 07">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem08_500.jpg" alt="Collage 08">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem09_500.jpg" alt="Collage 09">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem_Giongo_2022_2_600.jpg" alt="Collage Giongo 2022">
      <img class="thumb" src="../assets/images/iconografia/serie 2021-2022/colagem_pedro_04_500_300.jpg" alt="Collage Pedro 04">
    </div>
  </div>
</div>

<script>
  (function() {
    const featured = document.getElementById('featured-image');
    const thumbs = document.querySelectorAll('.carousel-thumbnails .thumb');
    
    thumbs.forEach(thumb => {
      thumb.addEventListener('click', function() {
        if (this.classList.contains('active')) return;
        
        const newSrc = this.getAttribute('src');
        
        // Adiciona classe de fade-out
        featured.classList.add('fade-out');
        
        // Remove 'active' das miniaturas e adiciona na clicada
        thumbs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        
        // Troca a imagem após o fade-out (250ms)
        setTimeout(() => {
          featured.src = newSrc;
          
          featured.onload = () => {
            featured.classList.remove('fade-out');
          };
          
          // Caso a imagem já esteja no cache
          if (featured.complete) {
            featured.classList.remove('fade-out');
          }
        }, 250);
      });
    });
  })();
</script>
